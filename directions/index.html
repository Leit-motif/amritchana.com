<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Amrit Chana — motion directions</title>
<style>
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eef1ec}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#eef1ec}
  .switcher{position:fixed;z-index:10;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;min-height:48px;padding:5px 7px;border:1px solid rgba(27,36,51,.18);border-radius:999px;background:rgba(251,252,250,.96);box-shadow:0 5px 26px rgba(27,36,51,.16);font:500 13px/1.2 system-ui,sans-serif;color:#1b2433;white-space:nowrap;backdrop-filter:blur(10px)}
  .switcher button{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;background:#1b2433;color:white;font:600 19px/1 system-ui,sans-serif;cursor:pointer}
  .switcher button:hover{background:#394254}
  .switcher button:focus-visible{outline:3px solid #c2362b;outline-offset:2px}
  output{min-width:154px;text-align:center}
  output strong{font-weight:700}
  .short{display:none}
  @media(max-width:420px){iframe{height:calc(100% - 50px)}.switcher{gap:4px;min-height:38px;padding:4px 5px;font-size:11px}.switcher button{width:28px;height:28px}output{width:82px;min-width:0;overflow:hidden;text-overflow:ellipsis}.full{display:none}.short{display:inline}}
  body[data-variant="b"]{background:#0c1711}
  body[data-variant="c"]{background:#f7eee7}
  @media(prefers-reduced-motion:reduce){.switcher button{transition:none}}
  noscript{position:fixed;z-index:20;inset:auto 12px 12px;padding:14px;border:1px solid #777;background:#fff;color:#111;font:14px/1.6 system-ui,sans-serif}
</style>
</head>
<body>
<!-- Three structural motion directions for the amritchana.com hero; switchable with ?variant=a|b|c. Throwaway review route, not production UI. -->
<iframe id="preview" title="Motion direction preview"></iframe>
<nav class="switcher" aria-label="Switch motion direction">
  <button id="previous" type="button" aria-label="Previous direction">←</button>
  <output id="current" aria-live="polite"></output>
  <button id="next" type="button" aria-label="Next direction">→</button>
</nav>
<noscript>JavaScript is off. Open a direction directly: <a href="a/">A — The time ledger</a>, <a href="b/">B — Signal to system</a>, or <a href="c/">C — The human in the loop</a>.</noscript>
<script>
(() => {
  const directions = [
    {key:'a',name:'The time ledger',short:'Time ledger'},
    {key:'b',name:'Signal to system',short:'Signals'},
    {key:'c',name:'The human in the loop',short:'Human loop'}
  ];
  const frame = document.getElementById('preview');
  const label = document.getElementById('current');
  const param = new URLSearchParams(location.search);
  let current = directions.some(d => d.key === param.get('variant')) ? param.get('variant') : 'a';

  function isEditable(target){return target instanceof Element && (target.matches('input,textarea,select,[contenteditable="true"]') || target.closest('input,textarea,select,[contenteditable="true"]'));}
  function setDirection(key, historyMode='replace'){
    const next = directions.find(d => d.key === key) || directions[0];
    current = next.key;
    document.body.dataset.variant=next.key;
    label.innerHTML = `<strong>${next.key.toUpperCase()}</strong><span class="full"> · ${next.name}</span><span class="short"> · ${next.short}</span>`;
    label.setAttribute('aria-label',`${next.key.toUpperCase()}, ${next.name}`);
    frame.src = `${next.key}/`;
    document.title = `Amrit Chana — ${next.key.toUpperCase()}: ${next.name}`;
    const url = new URL(location.href);
    url.searchParams.set('variant', next.key);
    history[historyMode+'State']({variant:next.key},'',url);
  }
  function cycle(delta){
    const at = directions.findIndex(d => d.key === current);
    setDirection(directions[(at + delta + directions.length) % directions.length].key);
  }
  document.getElementById('previous').addEventListener('click',()=>cycle(-1));
  document.getElementById('next').addEventListener('click',()=>cycle(1));
  window.addEventListener('keydown',event=>{
    if(isEditable(event.target)) return;
    if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
      event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);
    }
  });
  frame.addEventListener('load',()=>{
    try{frame.contentDocument.addEventListener('keydown',event=>{
      if(isEditable(event.target)) return;
      if(event.key==='ArrowLeft'||event.key==='ArrowRight'){
        event.preventDefault();cycle(event.key==='ArrowRight'?1:-1);
      }
    },true)}catch{}
  });
  window.addEventListener('popstate',()=>{
    const key=new URLSearchParams(location.search).get('variant');
    setDirection(key,'replace');
  });
  setDirection(current,'replace');
})();
</script>
</body>
</html>
